[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muscles-documents"
version = "0.2.0"
description = "Framework-level document ingestion primitives for Muscles"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{ name = "Denis B.", email = "denis@butko.info" }]
dependencies = [
  "muscles>=1.0.0rc1,<2.0.0",
  "pydantic>=2.7,<3.0",
]

[project.urls]
Homepage = "https://github.com/butkoden/muscles-documents"
Repository = "https://github.com/butkoden/muscles-documents"
Documentation = "https://github.com/butkoden/muscles-documents#readme"
PyPI = "https://pypi.org/project/muscles-documents/"
Releases = "https://github.com/butkoden/muscles-documents/releases"
"muscles" = "https://pypi.org/project/muscles/"
"muscles-ai" = "https://pypi.org/project/muscles-ai/"
"muscles-data-sql" = "https://github.com/butkoden/muscles-data-sql"
"muscles-mcp" = "https://pypi.org/project/muscles-mcp/"
"muscles-benchmarks" = "https://pypi.org/project/muscles-benchmarks/"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["muscles.documents*"]
